# pony-mode preset — lazy senior dev mindset + orchestrator.
#
# In the session (ONE merged bundle — the per-plugin ids this preset was written
# against, pony-1 / cavm-2 / orch-3, are dead: E5 forbids pinning them):
#   - the `ponytail` skill (upstream MIT): mode / review / audit / debt / gain / help
#   - orch_*   (smart mode picker, 4 tools)
#
# NOT active (toggle on separately if you need them):
#   - caveman    (terse prose)
#   - dsh-author (plugin authoring)
#   - memo       (Agent Note writing)
#
# Use when:
#   - Writing new code: the `ponytail` skill's YAGNI ladder keeps you minimal.
#   - Reviewing changes: the ponytail-review / ponytail-audit skills.
#   - You want smart routing: orch_route picks pony for build tasks.
#
# Do NOT use when:
#   - You want terse prose too — use the `simple` preset instead.

- id: pony-mode
  description: |
    Lazy senior dev mode + orchestrator.
    Active: the `ponytail` skill (YAGNI ladder, over-engineering review) and
    orch (smart mode picker). For coding tasks where you want minimum
    code, no over-engineering, and lazy defaults. Does NOT include
    terse prose — for that, use the `simple` preset.

    What you get:
    - the `ponytail` skill (upstream): mode / review / audit / debt / gain / help
    - orch_route / orch_compare / orch_pipeline / orch_status

    What you do NOT get: caveman (terse prose). dsh-author and memo
    are also off — toggle them separately when needed.
  config: {}
