# pony-mode preset — lazy senior dev mindset + orchestrator.
#
# Active plugins at session start:
#   1. pony-1   → ponytail    (lazy senior dev, 6 actions)
#   2. orch-3   → orch_*      (smart mode picker, 4 tools)
#
# NOT active (toggle on separately if you need them):
#   - cavm-2   (terse prose)
#   - dsha-4   (plugin authoring)
#   - memo-5   (Agent Note writing)
#
# Use when:
#   - Writing new code: pony's YAGNI ladder keeps you minimal.
#   - Reviewing changes: ponytail(review) / ponytail(audit).
#   - You want smart routing: orch_route picks pony for build tasks.
#
# Do NOT use when:
#   - You want terse prose too — use the `simple` preset instead.

- id: pony-mode
  description: |
    Lazy senior dev mode + orchestrator.
    Active plugins: pony (YAGNI ladder, over-engineering review) and
    orch (smart mode picker). For coding tasks where you want minimum
    code, no over-engineering, and lazy defaults. Does NOT include
    terse prose — for that, use the `simple` preset.

    What you get:
    - ponytail: 6 actions (mode / review / audit / debt / gain / help)
    - orch_route / orch_compare / orch_pipeline / orch_status

    What you do NOT get: caveman (terse prose). dsh-author and memo
    are also off — toggle them separately when needed.
  config: {}
