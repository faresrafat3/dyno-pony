# caveman-mode preset — terse prose only + orchestrator.
#
# In the session (ONE merged bundle — the per-plugin ids this preset was written
# against, cavm-2 / orch-3 / pony-1, are dead: E5 forbids pinning them):
#   - caveman  (terse prose, 4 actions)
#   - orch_*   (smart mode picker, 4 tools)
#
# NOT active (toggle on separately if you need them):
#   - the `ponytail` skill (lazy mindset)
#   - dsh-author (plugin authoring)
#   - memo       (Agent Note writing)
#
# Use when:
#   - You want short replies, no preamble, no throat-clearing.
#   - You want fragments, not paragraphs.
#   - You're tired of "I would be happy to help" / "Let me know if".
#   - You want smart routing to caveman for short factual questions.
#
# Do NOT use when:
#   - You want lazy mindset too — use the `simple` preset instead.

- id: caveman-mode
  description: |
    Terse prose mode + orchestrator.
    Active: caveman (drop filler, fragments OK) and orch
    (smart mode picker). For conversations where you want short replies,
    no preamble, no throat-clearing. Does NOT include lazy mindset —
    for that, use the `simple` preset.

    What you get:
    - caveman: 4 actions (terse / prose / mode / reset)
    - orch_route / orch_compare / orch_pipeline / orch_status

    What you do NOT get: the `ponytail` skill (lazy mindset). dsh-author and memo
    are also off — toggle them separately when needed.
  config: {}
